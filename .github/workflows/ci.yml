name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — audit, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm test

  frontend:
    name: Frontend — audit, lint, build, unit + a11y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install server deps and seed
        working-directory: server
        run: |
          npm install
          npm run seed
        env:
          JWT_SECRET: ci-test-secret

      - name: Start server
        working-directory: server
        run: nohup npm start &
        env:
          JWT_SECRET: ci-test-secret
          PORT: 4000

      - name: Install client deps and build
        working-directory: client
        run: |
          npm install
          npm run build

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Wait for API
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:4000/api/health && break
            sleep 1
          done

      - name: Run E2E suite
        working-directory: client
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
